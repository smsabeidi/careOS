<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CareOS">
  <!--
    Home-screen icon. The components/logo.tsx weave (an interlocked care cross)
    on a full-bleed field, scaled to 60% so it survives Android's `maskable`
    circle crop as well as iOS's rounded square. Vector, so one file covers
    every density; no raster variants to drift out of sync with the brand.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b2b63" />
      <stop offset="1" stop-color="#062045" />
    </linearGradient>
    <linearGradient id="pale" x1="280" y1="32" x2="64" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dcebfb" />
      <stop offset="0.55" stop-color="#b3d1f7" />
      <stop offset="1" stop-color="#7fadf0" />
    </linearGradient>
    <linearGradient id="blue" x1="448" y1="224" x2="232" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57a2ff" />
      <stop offset="0.5" stop-color="#1f7bfa" />
      <stop offset="1" stop-color="#0a55e6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#field)" />
  <g transform="translate(256 256) scale(2.4) translate(-64 -64)">
    <path d="M 64 22 L 64 44 Q 64 64 44 64 L 22 64" stroke="url(#pale)" stroke-width="40" stroke-linecap="round" fill="none" />
    <path d="M 64 106 L 64 84 Q 64 64 84 64 L 106 64" stroke="url(#blue)" stroke-width="40" stroke-linecap="round" fill="none" />
  </g>
</svg>
