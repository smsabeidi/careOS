name: CI
# ST-002 · PR → checks; pgTAP is the crown-jewel stage (docs/12 §3, docs/13 §4)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-tests:
    name: migrations + pgTAP compliance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database (applies migrations)
        run: supabase db start
      - name: Run pgTAP suite
        run: supabase test db
      # docs/07 §11 promised since v1.0 that the documented and deployed policy sets
      # "cannot drift — drift fails the build". Until ST-217 neither db/policies.md nor
      # its generator existed, so the promise guarded nothing. It runs in THIS job
      # because it needs a database with the full chain applied — a grep over migration
      # text cannot see a policy that a later migration dropped.
      - name: RLS policy catalog has not drifted
        run: |
          CAREOS_PSQL="psql $(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" \
            bash scripts/gen-policies.sh --check

  spec-drift-gate:
    name: spec-corpus drift gate (E4 / ST-103, D-010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Drift gate
        run: bash scripts/spec-drift-gate.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD"

  matrix-coverage:
    name: pgTAP matrix coverage (ST-110)
    # matrix.yaml has claimed this gate existed since 0005; until ST-110 the script did
    # not exist and the manifest had drifted badly behind the schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Matrix manifest completeness
        run: bash scripts/check-matrix.sh

  evals:
    name: prompt eval gate (WE / ST-245, docs/16 §3.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Start local database (registry prompts are rows, not literals)
        run: supabase db start
      # ST-244: migrations alone are NOT enough here. 0057 registers capabilities per
      # tenant — `select app.seed_front_door_capabilities(t.id) from public.tenant t` — so
      # a database with the chain applied and no seeded tenant registers nothing at all,
      # and the gate then reports every capability as unregistered. Seeding is what gives
      # this job something to evaluate.
      - name: Seed it (the capability registry is per-tenant)
        run: supabase db reset
      - name: Run the eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CAREOS_EVALS_DB_CONTAINER: supabase_db_careOS
          # Optional repo variable. `ai_capability.model` pins CareOS's own vocabulary
          # (D-013); if the evaluating provider does not serve that exact id, set this to
          # one it does. It changes what the GATE calls, never what SHIPS.
          CAREOS_EVALS_MODEL: ${{ vars.CAREOS_EVALS_MODEL }}
        # REQUIRED=1 iff the secret exists: with it, regressions fail the merge; without
        # it the runner prints UNARMED and exits 0 — a fork or a repo without the secret
        # must not hard-fail every PR, but it must also never print "passed".
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then export CAREOS_EVALS_REQUIRED=1; fi
          node scripts/evals/run.mjs
